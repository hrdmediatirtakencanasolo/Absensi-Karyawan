.hero-text{padding:16px 20px 20px}
.hero .sub{color:#FEFFFF;margin-bottom:12px}
.branch{margin:0 0 6px;font-size:1.1rem;font-weight:700;color:#e3be58}
h1 u{text-underline-offset:5px;text-decoration-thickness:2px;text-decoration-color:#e3be58}
#clock{font-size:2.4rem;font-weight:700;letter-spacing:.02em}
.panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px}
:focus-visible{outline:3px solid var(--main);outline-offset:1px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types input{position:absolute;opacity:0}
.types label{margin:0;text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:500}
.types input:checked+label{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.types input:focus-visible+label{outline:3px solid var(--main);outline-offset:2px}
.send{margin-top:20px;width:100%;padding:13px;border:0;border-radius:8px;background:var(--main);color:var(--main-ink);font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
.msg.ok{display:block;background:#c9a22733;color:var(--ink)}
.msg.err{display:block;background:#b3261e22;color:var(--bad)}
.cam video,.cam img{width:100%;max-height:320px;object-fit:cover;border-radius:8px;background:#000;display:block;margin-bottom:8px;transform:scaleX(-1)}
.cam img{transform:none}
.alt{width:100%;padding:11px;border:1px solid var(--main);border-radius:8px;background:transparent;color:var(--main);font:inherit;font-weight:600;cursor:pointer}
a{color:var(--main)}
.loc{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.92rem;color:var(--muted)}
.loc button{margin-top:8px;display:block}
.devinfo{margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.map{width:100%;height:220px;border:0;border-radius:8px;margin-top:8px;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="hero-img" role="img" aria-label="Logo Maknala Group dan May Star Restaurant"></div>
    <div class="hero-text">
      <h1><u>Absensi Karyawan PT. Media Tirta Kencana</u></h1>
      <p class="branch">Mini Head Quarter Solo</p>
      <p class="sub" id="today"></p>
      <div id="clock" aria-live="off">--:--:--</div>
    </div>
  </header>

  <section class="panel" id="p1">
    <div>
      <label for="nama">Nama</label>
      <select id="nama" required>
        <option value="">Pilih nama</option>
        <option>Andika Roni Saputra</option>
        <option>Wendy Kurniawan</option>
      </select>

      <label for="jabatan">Jabatan</label>
      <select id="jabatan" required>
        <option value="">Pilih jabatan</option>
        <option>Supervisor HRD</option>
        <option>Purchasing</option>
      </select>

      <label id="jl">Jenis absensi</label>
      <div class="types" role="radiogroup" aria-labelledby="jl">
        <span><input type="radio" name="jenis" id="j1" value="Masuk" checked><label for="j1">Absen masuk</label></span>
        <span><input type="radio" name="jenis" id="j2" value="Pulang"><label for="j2">Absen pulang</label></span>
        <span><input type="radio" name="jenis" id="j3" value="Izin"><label for="j3">Izin</label></span>
      </div>

      <div id="izinBox" hidden>
        <label for="alasan">Alasan izin</label>
        <select id="alasan"><option>Sakit</option><option>Lainnya</option></select>
        <label for="ket">Keterangan</label>
        <textarea id="ket" rows="2" placeholder="Contoh: demam, periksa ke dokter"></textarea>
      </div>

      <label>Lokasi (otomatis)</label>
      <div class="loc"><span id="lokasi" role="status">Mendeteksi lokasi…</span>
        <button type="button" class="alt" id="btnLoc">Coba lagi</button>
        <iframe id="mapForm" class="map" title="Peta lokasi Anda" loading="lazy" hidden></iframe></div>
      <p class="devinfo" id="devInfo"></p>

      <label>Foto selfie (wajib)</label>
      <div class="cam">
        <video id="vid" autoplay playsinline muted hidden></video>
        <img id="prev" alt="Hasil foto" hidden>
        <button type="button" class="alt" id="btnCam">Buka kamera</button>
      </div>

      <p class="devinfo" id="koneksi" role="status">Memeriksa koneksi ke spreadsheet…</p>

      <button class="send" id="kirim">Kirim absensi</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>

</main>

<script>
// Tempel URL Web App dari Google Apps Script di sini (lihat petunjuk)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLzQFfsWHV8pkK5DtQ5iJmEBtjWnc0Z6SJIWnp1PqbF-LU4Kt0XaKqk2FyLZNLOfhF/exec";

const $ = id => document.getElementById(id);
const hari = new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("today").textContent = hari;
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("id-ID",{hour12:false}).replace(/\./g,":")},1000);

// Tampilkan kolom izin
document.querySelectorAll('input[name=jenis]').forEach(r=>{
  r.onchange=()=>{ $("izinBox").hidden = document.querySelector('input[name=jenis]:checked').value!=="Izin"; };
});

function show(text,type){const m=$("msg");m.textContent=text;m.className="msg "+type;}

$("kirim").onclick = async () => {
  const nama = $("nama").value.trim();
  const jabatan = $("jabatan").value.trim();
  const jenis = document.querySelector('input[name=jenis]:checked').value;
  if(!nama){ show("Pilih nama dulu.","err"); $("nama").focus(); return; }
  if(!jabatan){ show("Pilih jabatan dulu.","err"); $("jabatan").focus(); return; }
  if(SCRIPT_URL.startsWith("GANTI")){ show("URL Google Apps Script belum diisi di file index.html.","err"); return; }
  if(!foto){ show("Ambil foto selfie dulu sebelum mengirim.","err"); return; }
  if(!lokasi){ show("Lokasi belum terdeteksi. Izinkan akses lokasi lalu tekan Coba lagi.","err"); return; }
  const dev = await infoDevice();
  const data = { nama, jabatan, jenis, foto, device:dev, lat:lokasi.lat, lng:lokasi.lng, akurasi:lokasi.akurasi, alasan: jenis==="Izin" ? $("alasan").value : "", keterangan: jenis==="Izin" ? $("ket").value.trim() : "" };
  const btn=$("kirim"); btn.disabled=true; btn.textContent="Mengirim…";
  try{
    const res = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
    const hasil = (await res.text()).trim();
    if(hasil!=="OK") throw new Error(hasil.slice(0,160)||"Tidak ada jawaban dari server");
    show("Absensi terkirim atas nama "+nama+".","ok");
    $("ket").value=""; foto=null; $("prev").hidden=true; $("btnCam").textContent="Buka kamera";
  }catch(e){ show("Gagal tersimpan ke spreadsheet: "+(e.message||e)+". Periksa URL Apps Script, akses \"Anyone\", dan deploy terbaru.","err"); }
  btn.disabled=false; btn.textContent="Kirim absensi";
};

// Cek koneksi ke Apps Script dan spreadsheet saat halaman dibuka
(async function cekKoneksi(){
  const el=$("koneksi");
  if(SCRIPT_URL.startsWith("GANTI")){ el.textContent="✗ URL Apps Script belum diisi di index.html (baris SCRIPT_URL)."; return; }
  try{
    const t=(await (await fetch(SCRIPT_URL)).text()).trim();
    el.textContent = t.startsWith("Absensi aktif") ? "✓ Terhubung ke spreadsheet." : "✗ Apps Script menjawab: "+t.slice(0,160);
  }catch(e){ el.textContent="✗ Tidak bisa terhubung ke Apps Script. Periksa URL (berakhiran /exec) dan akses \"Anyone\"."; }
})();

// Deteksi jenis perangkat yang dipakai
async function infoDevice(){
  const ua=navigator.userAgent, uad=navigator.userAgentData;
  const touchMac=/Macintosh/.test(ua)&&navigator.maxTouchPoints>1;
  const tipe=(/iPad|Tablet|PlayBook|Silk/i.test(ua)||(/Android/.test(ua)&&!/Mobile/.test(ua))||touchMac)?"Tablet":(/Mobi|Android|iPhone|iPod/i.test(ua)?"HP":"Komputer");
  const os=/Windows/.test(ua)?"Windows":/Android/.test(ua)?"Android":(/iPhone|iPad|iPod/.test(ua)||touchMac)?"iOS":/Mac OS X/.test(ua)?"macOS":/CrOS/.test(ua)?"ChromeOS":/Linux/.test(ua)?"Linux":"Lainnya";
  const browser=/Edg\//.test(ua)?"Edge":/OPR\/|Opera/.test(ua)?"Opera":/SamsungBrowser/.test(ua)?"Samsung Internet":/Firefox|FxiOS/.test(ua)?"Firefox":/Chrome|CriOS/.test(ua)?"Chrome":/Safari/.test(ua)?"Safari":"Lainnya";
  let model="";
  if(/iPhone/.test(ua)) model="iPhone"; else if(/iPad/.test(ua)||touchMac) model="iPad";
  else if(/Android/.test(ua)){ const m=ua.match(/;\s*([^;)]+?)\s*(?:Build|\))/); if(m) model=m[1]; }
  try{ if(uad&&uad.getHighEntropyValues){ const h=await uad.getHighEntropyValues(["model"]); if(h.model) model=h.model; } }catch(e){}
  if(model==="K") model="";
  return {tipe, os, browser, model, layar:screen.width+"x"+screen.height};
}
infoDevice().then(d=>{ $("devInfo").textContent="Perangkat: "+[d.tipe,d.model,d.os,d.browser].filter(Boolean).join(" · "); });

// Lokasi otomatis dari GPS; alamat dicari oleh Apps Script saat data dikirim
let lokasi = null;
function cariLokasi(){
  const el=$("lokasi"); lokasi=null; $("mapForm").hidden=true;
  if(!navigator.geolocation){ el.textContent="Browser tidak mendukung lokasi."; return; }
  el.textContent="Mendeteksi lokasi…";
  navigator.geolocation.getCurrentPosition(p=>{
    lokasi={lat:p.coords.latitude,lng:p.coords.longitude,akurasi:Math.round(p.coords.accuracy)};
    $("mapForm").src="https://maps.google.com/maps?q="+lokasi.lat+","+lokasi.lng+"&z=17&output=embed"; $("mapForm").hidden=false;
    el.textContent="Lokasi terdeteksi ("+lokasi.lat.toFixed(5)+", "+lokasi.lng.toFixed(5)+", akurasi ±"+lokasi.akurasi+" m). Alamat dicatat otomatis saat dikirim.";
  },()=>{ el.textContent="Lokasi tidak terdeteksi. Izinkan akses lokasi di browser, lalu tekan Coba lagi."; },
  {enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
$("btnLoc").onclick=cariLokasi; cariLokasi();

// Kamera: foto diambil langsung dari kamera (tidak bisa dari galeri)
let foto = null, stream = null;
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } $("vid").hidden=true; }
$("btnCam").onclick = async () => {
  const btn = $("btnCam");
  if(stream){ // ambil foto
    const v=$("vid"), w=480, h=Math.round(v.videoHeight*w/v.videoWidth)||360;
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const x=c.getContext("2d"); x.drawImage(v,0,0,w,h);
    const cap=new Date().toLocaleString("id-ID");
    x.fillStyle="rgba(0,0,0,.55)"; x.fillRect(0,h-26,w,26);
    x.fillStyle="#fff"; x.font="14px sans-serif"; x.fillText(cap,8,h-8);
    foto=c.toDataURL("image/jpeg",0.7);
    $("prev").src=foto; $("prev").hidden=false;
    stopCam(); btn.textContent="Foto ulang"; return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
    cariLokasi(); $("vid").srcObject=stream; $("vid").hidden=false; $("prev").hidden=true; foto=null;
    btn.textContent="Ambil foto";
  }catch(e){ show("Kamera tidak bisa dibuka. Izinkan akses kamera di browser lalu coba lagi.","err"); }
};

</script>
</body>
</html>
